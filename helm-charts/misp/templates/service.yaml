apiVersion: v1
kind: Service
metadata:
  name: {{ include "misp.fullname" . }}-app
  labels:
    {{- include "misp.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.misp.service.type }}
  ports:
    - port: {{ .Values.misp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "misp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
